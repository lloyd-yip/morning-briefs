<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Morning brief · Ryan · Wednesday Sep 9, 2026</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a222c;
    --border: #2a3544;
    --text: #e8eef5;
    --muted: #9aabbd;
    --accent: #5b9fd4;
    --body: #c5d4e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 20px 14px 56px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.3rem; font-weight: 650; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 18px; }
  button {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1e3a55; border-color: var(--accent); }
  .slate {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .slate h2 {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); margin: 0 0 10px;
  }
  .slot { padding: 12px 0; border-top: 1px solid var(--border); }
  .slot:first-of-type { border-top: none; padding-top: 0; }
  .slot strong { display: block; font-size: 0.98rem; margin-bottom: 6px; }
  details.pack {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden;
  }
  details.pack > summary {
    list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  details.pack > summary::-webkit-details-marker { display: none; }
  details.pack > summary::after { content: none; }
  .expand-pill {
    flex-shrink: 0;
    font-size: 0.72rem;
    font-weight: 650;
    letter-spacing: 0.02em;
    color: #0f1419;
    background: var(--accent);
    border-radius: 999px;
    padding: 4px 10px;
    line-height: 1.2;
  }
  .expand-pill::after { content: "Expand"; }
  details.pack[open] .expand-pill::after { content: "Collapse"; }
  .body {
    padding: 0 16px 16px; border-top: 1px solid var(--border);
    color: var(--body); font-size: 0.92rem;
  }
  .body h3 {
    color: var(--muted); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.04em; margin: 14px 0 6px;
  }
  .body ul, .body ol { margin: 0; padding-left: 1.15rem; }
  .body li { margin: 6px 0; }
  .body p { margin: 6px 0; }
  .body b { color: var(--text); }
  .note { margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
  code { font-size: 0.85em; color: #b8d4ea; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Morning brief · Ryan</h1>
      <p class="meta">Wednesday Sep 9, 2026 · unique dated URL · packs start collapsed</p>
    </header>

    <div class="toolbar">
      <button class="primary" type="button" onclick="setAll(true)">Expand all</button>
      <button type="button" onclick="setAll(false)">Collapse all</button>
    </div>

    <section class="slate">
      <h2>Today’s slate</h2>
      <div class="slot">
        <strong>11:00 AM ET · Steve Young · Call 2 · Pocket-E</strong>
      </div>
      <div class="slot">
        <strong>4:00 PM ET · Frank Auger · Call 1 · Fassilio</strong>
      </div>
    </section>

    <!-- packs pending enrich -->

    <p class="note">Prep packs for today’s confirmed calls. Expand a pack when you’re ready.</p>
  </div>
  <script>
    function setAll(open) {
      document.querySelectorAll('details.pack').forEach(d => d.open = open);
    }
  </script>
</body>
</html>
